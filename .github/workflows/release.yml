name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          host: windows
          cache: true
      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Stage and deploy
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME
          $dir = "dist/hash-$version-windows-amd64"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item build/Release/hash.exe, build/Release/hash-gui.exe $dir/
          windeployqt --release --no-translations --compiler-runtime --dir $dir build/Release/hash-gui.exe
          Compress-Archive -Path $dir -DestinationPath "dist/hash-$version-windows-amd64.zip"
          $zip = "hash-$version-windows-amd64.zip"
          (Get-FileHash "dist/$zip" -Algorithm SHA256).Hash.ToLower() + "  $zip" |
            Set-Content "dist/sha256sums.txt"
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/sha256sums.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
