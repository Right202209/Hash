name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches project version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME -replace '^v', ''
          $cmake = Get-Content CMakeLists.txt -Raw
          $match = [regex]::Match($cmake, 'project\(Hash VERSION ([0-9][0-9.]{0,30})')
          if (-not $match.Success) { throw "project VERSION not found in CMakeLists.txt" }
          $version = $match.Groups[1].Value
          if ($tag -ne $version) {
            throw "tag $env:GITHUB_REF_NAME does not match CMake project version $version"
          }
          "HASH_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          host: windows
          cache: true
      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error
      - name: Check CLI version
        shell: pwsh
        run: |
          $out = (& build/Release/hash.exe -version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "hash.exe -version exited with $LASTEXITCODE" }
          if ($out -ne "hash $env:HASH_VERSION") { throw "unexpected version output: $out" }
      - name: Stage and deploy
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME
          $dir = "dist/hash-$version-windows-amd64"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item build/Release/hash.exe, build/Release/hash-gui.exe $dir/
          # The toolbox is fully offline: skip the QtNetwork TLS and network
          # status plugins (and the image formats already skipped) so the
          # deployed footprint stays as small as possible.
          windeployqt --release --no-translations --compiler-runtime --dir $dir `
            --no-system-d3d-compiler --no-opengl-sw `
            --skip-plugin-types imageformats,networkinformation,tls `
            --qmldir src/app build/Release/hash-gui.exe
          # Repack with maximum deflate: the runner's 7-Zip compresses the Qt
          # runtime noticeably better than Compress-Archive.
          & "C:\Program Files\7-Zip\7z.exe" a -tzip -mx=9 `
            "dist/hash-$version-windows-amd64.zip" "$dir" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z pack failed with $LASTEXITCODE" }
          $zip = "hash-$version-windows-amd64.zip"
          (Get-FileHash "dist/$zip" -Algorithm SHA256).Hash.ToLower() + "  $zip" |
            Set-Content "dist/sha256sums.txt"
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/sha256sums.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
