name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
      - name: Test
        run: go test ./...
      - name: Build CLI
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w" -o hash.exe ./cmd/hash
      - name: Build GUI
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w -H=windowsgui" -o hash-gui.exe ./cmd/hash-gui
      - name: Stage release artifacts
        run: |
          mkdir dist
          cp hash.exe "dist/hash-${GITHUB_REF_NAME}-windows-amd64.exe"
          cp hash-gui.exe "dist/hash-gui-${GITHUB_REF_NAME}-windows-amd64.exe"
          (cd dist && sha256sum -- * > sha256sums.txt)
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
