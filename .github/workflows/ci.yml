name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          host: linux
          cache: true
      - name: Install tooling
        run: sudo apt-get update && sudo apt-get install -y clang-format libgl1-mesa-dev
      - name: Format check
        run: clang-format --dry-run -Werror $(git ls-files '*.cpp' '*.h')
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error
      - name: Dump generated QML module metadata
        run: |
          find build -name qmldir -print -exec cat {} \;
          find build -name "*.qmltypes" -print
          find build -name "*qmltyperegistration*" -print
      - name: Smoke run GUI headless
        run: |
          set +e
          timeout 10 env QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software \
            QML_IMPORT_TRACE=1 ./build/hash-gui
          code=$?
          set -e
          echo "exit=$code"
          cat "$HOME/.local/share/Hash/hash-gui/gui.log" || true
          # 124 = the timeout killed a still-running window: launch succeeded.
          test "$code" = 124

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          host: windows
          cache: true
      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error
